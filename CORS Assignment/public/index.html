<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>simple-cors</title>
        <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    </head>
    <body>
        <input id="a" type="text" placeholder="1st val"></input>
        <input id="b" type="text" placeholder="2nd val"></input>
        <button onclick="sendrequest()">Find Sum</button>
        <script>
            async function sendrequest(){
                const response=await axios.post("http://localhost:3004/sum",{
                    a: document.getElementById("a").value,
                    b: document.getElementById("b").value
                });
                console.log(response.data);
            }
        </script>
    </body>
</html>
