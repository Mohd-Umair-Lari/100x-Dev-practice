<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pokemon-App</title>
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body>
        <input id="num-card" type="number" placeholder="number of cards to generate less than 20">
        <button onclick="rendercard()">generate</button>
        <div id="cards"></div>
        <script>
            
            const val=document.getElementById("num-card");
            async function rendercard(){
                const min = 0;
                const max = 19;

                for (let i = 0; i < val.value; i++) {
                    let num = Math.floor(Math.random() * (max - min + 1)) + min;
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${num}`);
                    const arr = await response.json();
                    document.getElementById("cards").innerHTML+=`
                            <div class="pokemon-card">
                                <h3>${arr.name.toUpperCase()}</h3>
                                <img src="${arr.sprites.front_default}" alt="${arr.name}">
                            </div>
                        `;
                }
            }
        </script>
    </body>
</html>
