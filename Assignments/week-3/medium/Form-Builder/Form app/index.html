<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Form Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Dynamic Form Builder</h1>
            <p>Customize and generate your custom forms dynamically in real-time</p>
        </header>

        <main class="builder-layout">
            <!-- Left Panel: Builder Controls -->
            <section class="card builder-card">
                <h2>Add New Field</h2>

                <div class="form-group">
                    <label for="field-type">Field Type</label>
                    <select id="field-type" onchange="handleTypeChange()">
                        <option value="text">Text Input</option>
                        <option value="checkbox">Checkbox</option>
                        <option value="radio">Radio Button</option>
                        <option value="number">Number Input</option>
                        <option value="email">Email Input</option>
                        <option value="textarea">Textarea</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="field-label">Field Label <span class="required">*</span></label>
                    <input type="text" id="field-label" placeholder="e.g., Full Name, Subscribe to newsletter">
                </div>

                <div class="form-group" id="placeholder-group">
                    <label for="field-placeholder">Placeholder (Optional)</label>
                    <input type="text" id="field-placeholder" placeholder="e.g., Enter your name...">
                </div>

                <div class="button-group">
                    <button type="button" id="add-btn" class="btn btn-primary" onclick="addField()">Add Field</button>
                    <button type="button" id="clear-all-btn" class="btn btn-secondary" onclick="clearAllFields()">Clear
                        All</button>
                </div>
            </section>

            <!-- Right Panel: Live Form Preview -->
            <section class="card preview-card">
                <div class="preview-header">
                    <h2>Form Preview</h2>
                    <span id="field-counter" class="badge">0 Fields</span>
                </div>

                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p class="empty-title">Your form is empty</p>
                    <p class="empty-desc">Select a field type on the left and click "Add Field" to build your custom
                        form.</p>
                </div>

                <form id="dynamic-form" class="dynamic-form">
                    <div id="fields-container" class="fields-container"></div>
                    <div id="form-actions" class="form-actions hidden">
                        <button type="submit" class="btn btn-submit">Submit Form</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
