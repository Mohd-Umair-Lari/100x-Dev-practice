<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Test Header</title>
        <link href="style.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        Posts
        <button onclick="getLatespost()">Fetch posts</button>
        <div id="posts"></div>
        <script>
            async function getLatespost(){
                // axios is just a syntactical sugar on top
                // AJAX => stands for Asynchronous JSON and XML
                const response = await fetch("https://jsonplaceholder.typicode.com/posts");
                const arr = await response.json();
                for(let i=0;i<arr.length;i++){
                    document.getElementById("posts").innerHTML+=("<div>"+arr[i].title+"</div>");
                }
                console.log("Data Loaded");
            }
            getLatespost();
        </script>
    </body>
</html>
