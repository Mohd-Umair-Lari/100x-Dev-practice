<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Test Header</title>
        <link href="style.css" rel="stylesheet" type="text/css">

    <body>
        Posts
        <div id="posts"></div>

            getLatespost();
